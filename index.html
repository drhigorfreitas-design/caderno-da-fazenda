<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171513">
<title>Fazenda Recanto do Boqueirão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
html{color-scheme:light} body{margin:0}

/* Layout: celular = uma coluna, barra de abas escura flutuante embaixo. Desktop = menu escuro à esquerda, painel claro arredondado, atividade à direita. Faixa dourada de boas-vindas */
:root{
  --bg:#f1f5ec; --surface:#ffffff; --sunk:#edf3e4; --ink:#1b2418; --muted:#66765f; --line:#dde7d1;
  --gold:#3f8f2f; --gold-ink:#ffffff; --gold-soft:#e3f1d8; --cream:#eef5e6; --capim:#2e7a24; --capim-ink:#ffffff; --ipe:#3f8f2f; --ipe-soft:#e3f1d8;
  --good:#2b7a44; --bad:#b23a2a; --warn:#8f600c; --f-cria:#5b9a47; --f-recria:#4a80c4; --f-engorda:#d1693a;
  --shell:#10200f; --nav:#16301a; --nav-ink:#b9d2b8; --shadow:0 2px 14px rgb(30 70 20 / .09);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c130e; --surface:#15201a; --sunk:#1d2b22; --ink:#e8f0e4; --muted:#9bb09b; --line:#27382c;
  --gold:#58b043; --gold-ink:#06130a; --gold-soft:#1f3a22; --cream:#16221a; --capim:#8fd47a; --capim-ink:#06130a; --ipe:#58b043; --ipe-soft:#1f3a22;
  --good:#6fcf8a; --bad:#f08a7a; --warn:#e5b65a; --f-cria:#7cc068; --f-recria:#7aa7e6; --f-engorda:#e8895c;
  --shell:#060d08; --nav:#0a1510; --nav-ink:#a9c4a9; --shadow:0 2px 14px rgb(0 0 0 / .4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c130e; --surface:#15201a; --sunk:#1d2b22; --ink:#e8f0e4; --muted:#9bb09b; --line:#27382c;
  --gold:#58b043; --gold-ink:#06130a; --gold-soft:#1f3a22; --cream:#16221a; --capim:#8fd47a; --capim-ink:#06130a; --ipe:#58b043; --ipe-soft:#1f3a22;
  --good:#6fcf8a; --bad:#f08a7a; --warn:#e5b65a; --f-cria:#7cc068; --f-recria:#7aa7e6; --f-engorda:#e8895c;
  --shell:#060d08; --nav:#0a1510; --nav-ink:#a9c4a9; --shadow:0 2px 14px rgb(0 0 0 / .4); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto}
/* faixa de boas-vindas */
.band{background:var(--gold);color:var(--gold-ink);border-radius:20px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;overflow:hidden;margin-top:12px}
.band::after{content:"";position:absolute;right:-70px;top:-90px;width:250px;height:250px;border-radius:50%;border:1px solid rgb(255 255 255 / .35);box-shadow:0 0 0 30px rgb(255 255 255 / .07),0 0 0 60px rgb(255 255 255 / .05);pointer-events:none}
.band-txt{min-width:0;position:relative;z-index:1}
.band h1{font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.015em;margin:0;color:var(--gold-ink)}
.band-sub{margin:4px 0 0;font-size:13px;color:rgb(36 26 5 / .78)}
.band-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.bbtn{border:0;background:#fff;color:#241a05;font:700 13px var(--body);padding:10px 16px;border-radius:12px;cursor:pointer;box-shadow:0 2px 8px rgb(60 40 0 / .16)}
.band-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;position:relative;z-index:1;flex:none}
.ring{width:84px;height:84px;border-radius:50%;border:3px solid rgb(255 255 255 / .65);display:grid;place-items:center;background:rgb(255 255 255 / .2)}
.ring svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.band .chip{background:rgb(255 255 255 / .35);color:var(--gold-ink)}
.band .chip.good,.band .chip.bad,.band .chip.warn{color:var(--gold-ink)}
.band .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:#6b5a2c}
.band .chip.good::before{background:#1f7a3f} .band .chip.bad::before{background:#b23a2a} .band .chip.warn::before{background:#8f600c}
.band.slim{padding:12px 18px;border-radius:16px}
.band.slim .band-sub,.band.slim .band-btns,.band.slim .ring{display:none}
.band.slim h1{font-size:16px}
.band.slim .band-right{flex-direction:row}
.statrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat-c{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:12px;min-width:0}
.stat-c .ico{width:44px;height:44px;flex:none;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;color:var(--capim)}
.stat-c .ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat-c b{display:block;font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat-c small{font-size:11px;color:var(--muted);font-weight:500}
[hidden]{display:none!important}
.janela{margin:0}
@media (max-width:639px){.band{padding:18px 16px;gap:10px}.band h1{font-size:19px}.ring{width:54px;height:54px;border-width:2px}.ring svg{width:28px;height:28px}.band-btns{margin-top:12px}.bbtn{padding:9px 13px}.page-title h2{font-size:22px}}
@media (min-width:640px){.statrow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cols{display:grid;gap:18px;align-items:start}
.seg[aria-label="Período"]{max-width:520px}
.page-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.page-title h2{font-size:30px}
.page-title .dot{width:14px;height:14px}
nav .brand,nav.tabs button.tab-extra,nav.tabs .nav-sep{display:none}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
section.view{display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.seg{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:10px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.janela{font-size:13px;color:var(--muted)}
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.row-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ind{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.ind:last-child{border-bottom:0}
.ind .t{font-weight:600;display:block}
.ind .f{font-size:12px;color:var(--muted);display:block}
.ind-v{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.ind-v .v{font-weight:600;font-size:17px;white-space:nowrap}
.ind-v .ref{font-size:12px;color:var(--muted);white-space:nowrap}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted);grid-column:1;min-width:0}
.item .amt{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.item .act{grid-column:2;text-align:right}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat .v{font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--ipe-soft);color:var(--warn)} .chip.bad{color:var(--bad)} .chip.good{color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 12px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--capim);color:var(--capim-ink);border-color:var(--capim)}
.btn.link{border:0;background:transparent;color:var(--capim);padding:4px 0}
.btn.del{border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px 0}
.btn.del[data-armed]{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ipe);outline-offset:2px}
.banner{background:var(--ipe-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.note{font-size:13px;color:var(--muted);margin:0}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0;white-space:normal}
.tbl tfoot td{font-weight:700;border-bottom:0}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quad div{border-radius:9px;padding:9px 10px;background:var(--sunk);font-size:12px;color:var(--muted);border:2px solid transparent}
.quad div b{display:block;font-size:13px;color:var(--ink)}
.quad div[data-on]{border-color:var(--ipe);background:var(--ipe-soft)}
.quad div[data-on] b{color:var(--ink)}
.bar{height:6px;background:var(--sunk);border-radius:3px;margin-top:4px;position:relative}
.bar i{display:block;height:6px;background:var(--ipe);border-radius:3px}
.bar s{position:absolute;top:-3px;width:2px;height:12px;background:var(--capim)}
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--nav);border-radius:20px;padding:6px;box-shadow:0 8px 28px rgb(0 0 0 / .32)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
nav.tabs .in button{border:0;background:transparent;color:var(--nav-ink);font:600 10.5px var(--body);padding:7px 0;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
nav.tabs .in button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .in button[aria-current="page"]{background:var(--gold);color:var(--gold-ink)}
.nav-bottom{display:contents}
.who,.theme-nav{display:none}
.fab{position:fixed;z-index:21;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));
  background:var(--gold);color:var(--gold-ink);border:0;border-radius:999px;font:700 15px var(--body);padding:13px 20px;box-shadow:0 6px 18px rgb(0 0 0 / .25);cursor:pointer}
.theme{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:12px}
.theme button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--muted);font:600 12px var(--body);padding:8px 10px;border-radius:9px;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.theme svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgb(0 0 0 / .42);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.types button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;cursor:pointer;font:600 15px var(--body)}
.types button span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
form.f{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.fl input,label.fl select{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.grid3 .cat{font-size:14px;font-weight:600;padding-bottom:10px;min-width:0}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-size:13px;font-weight:700;padding:0 4px}
.calc{background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:14px}
details summary{cursor:pointer;color:var(--capim);font-weight:600;font-size:14px}
.fases{display:grid;gap:12px}
.fase-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fase-card[data-sel]{border-color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.mini div{display:flex;flex-direction:column;min-width:0}
.mini .l{font-size:11px;letter-spacing:.04em;overflow-wrap:anywhere;text-transform:uppercase;color:var(--muted);font-weight:600}
.mini .v{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.res-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.res-line .v{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.share{height:6px;border-radius:3px;background:var(--sunk);display:flex;overflow:hidden}
.share i{display:block;height:6px}
.tbl.cmp th,.tbl.cmp td{min-width:92px}
.tbl.cmp td:first-child,.tbl.cmp th:first-child{min-width:150px;position:sticky;left:0;background:var(--surface)}
.tbl tr.sub td{font-weight:700;background:var(--sunk)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.sec-title h2{font-size:26px}
ol.steps{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:12px}
ol.steps li{padding-left:4px}
ol.steps b{display:block}
ol.steps .btn{margin-top:6px}
.ing{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.7fr) minmax(0,.9fr);gap:8px;align-items:end;margin-bottom:6px}
.meta-chip.ok{color:var(--good)} .meta-chip.low,.meta-chip.high{background:var(--ipe-soft);color:var(--warn)}
.mixcalc{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:6px}
.mixcalc label{max-width:180px}
ol.adapt{margin:6px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(144px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (min-width:640px){.fases{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:repeat(4,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){
  html,body{background:var(--shell)}
  body{padding:18px 18px 18px 268px}
  .wrap{max-width:1680px}
  .frame{background:var(--surface);border-radius:28px;min-height:calc(100vh - 36px);overflow:hidden}
  .main{padding:24px 32px 40px}
  .side{margin:0;border-radius:0;padding:26px 28px 32px}
  nav.tabs{top:0;left:0;bottom:0;right:auto;width:250px;background:transparent;border-radius:0;box-shadow:none;padding:26px 16px 20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
  nav.tabs .in{display:flex;flex-direction:column;gap:6px;max-width:none;margin:0}
  nav.tabs .in button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:12px 14px;border-radius:12px}
  nav.tabs .in button:hover{background:rgb(255 255 255 / .07)}
  nav.tabs .in button[aria-current="page"]:hover{background:var(--gold)}
  nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;line-height:1.1;color:#fff;padding:0 8px 6px}
  nav .brand .mk{width:38px;height:38px;border-radius:11px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-size:15px;font-weight:800}
  nav.tabs button.tab-extra{display:flex} nav.tabs button.tab-more{display:none}
  nav.tabs .nav-sep{display:block;height:1px;background:var(--nav-line,rgb(255 255 255 / .1));margin:8px 12px}
  .nav-bottom{display:flex;flex-direction:column;gap:12px;margin-top:auto}
  .fab{position:static;width:100%;border-radius:12px;padding:12px;font-size:14px;box-shadow:none}
  .who{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgb(255 255 255 / .13);border-radius:14px;color:#fff;min-width:0}
  .who .av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-weight:800;display:grid;place-items:center;flex:none}
  .who div{min-width:0}
  .who b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who small{font-size:11px;color:var(--nav-ink)}

const addM=(m,n)=>{let y=+m.slice(0,4),mm=+m.slice(5,7)-1+n;y+=Math.floor(mm/12);mm=((mm%12)+12)%12;return y+'-'+String(mm+1).padStart(2,'0');};
const diffM=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const mEnd=m=>{const d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0));return d.toISOString().slice(0,10);};
const mLabel=m=>m?MES[+m.slice(5,7)-1]+'/'+m.slice(2,4):'';
const dBR=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4):'';
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const kgA=()=>Number(S.config.kgArroba)||30;
const area=()=>Number(S.config.area)||0;
const preco=c=>Number((S.config.precos||{})[c])||PRECO_PADRAO[c]||0;
const sum=(a,f)=>a.reduce((s,x)=>s+(Number(f(x))||0),0);
const cabOf=(f,c)=>Number(f?.cats?.[c]?.cab)||0, pesoOf=(f,c)=>Number(f?.cats?.[c]?.peso)||0;
const fCab=(f,cs=CK)=>sum(cs,c=>cabOf(f,c)), fKg=(f,cs=CK)=>sum(cs,c=>cabOf(f,c)*pesoOf(f,c));
const fVal=(f,cs=CK)=>sum(cs,c=>cabOf(f,c)*pesoOf(f,c)/kgA()*preco(c));
const faseOf=c=>(S.config.fases||{})[c]||FASE_PADRAO[c];
const st=(cond)=>cond==null?null:cond?'ok':'bad';

/* ---------- janela de análise ---------- */
function janela(per=UI.per){
  const t=ym(today()), m0=Number(S.config.safraMes)||7, y=+t.slice(0,4), m=+t.slice(5,7);
  const sy=m>=m0?y:y-1, ini=sy+'-'+String(m0).padStart(2,'0');
  let s,e,nome;
  if(per==='safra'){s=ini;e=t;nome='Safra '+sy+'/'+String(sy+1).slice(2);}
  else if(per==='safraAnt'){s=addM(ini,-12);e=addM(ini,-1);nome='Safra '+(sy-1)+'/'+String(sy).slice(2);}
  else {s=addM(t,-11);e=t;nome='Últimos 12 meses';}
  const F=[...S.fech].sort((a,b)=>a.mes<b.mes?-1:1);
  let ei=F.filter(f=>f.mes<s).pop(); const inW=F.filter(f=>f.mes>=s&&f.mes<=e);
  if(!ei) ei=inW[0];
  const ef=ei?inW.filter(f=>f.mes>ei.mes).pop():null;
  if(!ei||!ef){ return {ok:false,s,e,nome,meses:diffM(s,e)+1,fechs:[],inR:d=>!!d&&ym(d)>=s&&ym(d)<=e}; }
  return {ok:true,s,e,nome,ei,ef,meses:diffM(ei.mes,ef.mes),fechs:F.filter(f=>f.mes>ei.mes&&f.mes<=ef.mes),
    dias:days(mEnd(ei.mes),mEnd(ef.mes)),inR:d=>!!d&&ym(d)>ei.mes&&ym(d)<=ef.mes};
}
function estoqueValor(dt){
  return sum(S.insumos,i=>{const ms=S.emovs.filter(m=>m.insumoId===i.id&&m.data<=dt);
    const ent=ms.filter(m=>m.tipo==='entrada'), q=sum(ent,m=>m.qtd), v=sum(ent,m=>m.valor);
    const saldo=sum(ms,m=>(m.tipo==='entrada'?1:-1)*m.qtd); return q>0?saldo*(v/q):0;});
}
function pesoMov(x){ if(+x.pesoMedio) return +x.pesoMedio; const F=[...S.fech].sort((a,b)=>a.mes<b.mes?-1:1); const ant=F.filter(f=>f.mes<ym(x.data)).pop()||F.find(f=>f.mes===ym(x.data)); return pesoOf(ant,x.categoria); }
const valTransf=x=>(+x.cab||0)*pesoMov(x)/kgA()*preco(x.para);
function calc(per=UI.per,fase=null){
  const J=janela(per), R={J,fase};
  const cats=fase?CK.filter(c=>faseOf(c)===fase):CK, inF=c=>!fase||faseOf(c)===fase;
  const mv=S.movs.filter(x=>J.inR(x.data)), deAll=S.desemb.filter(x=>J.inR(x.data));
  const kg=a=>sum(a,x=>(+x.cab||0)*pesoMov(x)), cb=a=>sum(a,x=>x.cab);
  const vend=mv.filter(x=>x.tipo==='venda'&&inF(x.categoria)), comp=mv.filter(x=>x.tipo==='compra'&&inF(x.categoria));
  const tOut=fase?mv.filter(x=>x.tipo==='transferencia'&&inF(x.categoria)&&!inF(x.para)):[];
  const tIn=fase?mv.filter(x=>x.tipo==='transferencia'&&!inF(x.categoria)&&inF(x.para)):[];
  R.receitaExt=sum(vend,x=>x.valor); R.transfOut=sum(tOut,valTransf); R.transfIn=sum(tIn,valTransf);
  R.receita=R.receitaExt+R.transfOut; R.reposicao=sum(comp,x=>x.valor)+R.transfIn;
  R.vendasKg=kg(vend)+kg(tOut); R.vendasCab=cb(vend)+cb(tOut); R.comprasKg=kg(comp)+kg(tIn);
  R.mortes=cb(mv.filter(x=>x.tipo==='morte'&&inF(x.categoria)));
  R.vendasArr=R.vendasKg/kgA(); R.precoArr=R.receita/R.vendasArr; R.precoKg=R.receita/R.vendasKg;
  R.meses=J.meses; R.anual=12/J.meses;
  let share=fase?0:1;
  if(J.ok){ const n=J.fechs.length;
    R.rebMed=sum(J.fechs,f=>fCab(f,cats))/n; R.uaMed=sum(J.fechs,f=>fKg(f,cats)/450)/n; R.uaTot=sum(J.fechs,f=>fKg(f)/450)/n;
    R.matrizesMed=sum(J.fechs,f=>cabOf(f,'matrizes'))/n; if(fase) share=R.uaTot?R.uaMed/R.uaTot:0; }
  R.share=share*100;
  const de=fase?deAll.filter(x=>x.centro===fase).map(x=>({...x,w:1})).concat(deAll.filter(x=>!CENTROS.includes(x.centro)).map(x=>({...x,w:share}))):deAll.map(x=>({...x,w:1}));
  const dv=a=>sum(a,x=>(+x.valor||0)*x.w);
  R.despesas=dv(de); R.direto=fase?dv(de.filter(x=>x.centro===fase)):R.despesas; R.rateio=R.despesas-R.direto;
  R.porGrupo={}; de.forEach(x=>R.porGrupo[x.grupo]=(R.porGrupo[x.grupo]||0)+(+x.valor||0)*x.w);
  R.var=dv(de.filter(x=>GVAR.has(x.grupo))); R.fix=R.despesas-R.var;
  R.insPas=dv(de.filter(x=>INS_PAS.has(x.grupo))); R.invest=dv(de.filter(x=>x.tipo==='investimento'));
  const A=fase?(+(S.config.areaFase||{})[fase]||0):area(); R.area=A;
  if(J.ok){
    R.prodKg=fKg(J.ef,cats)-fKg(J.ei,cats)-R.comprasKg+R.vendasKg; R.prodArr=R.prodKg/kgA();
    R.gmd=R.prodKg/R.rebMed/J.dias; R.arrHa=R.prodArr/A*R.anual;
    R.desfrute=R.prodArr/(fKg(J.ei,cats)/kgA())*100; R.taxaVendas=R.vendasCab/fCab(J.ei,cats)*100;
    R.uaHa=R.uaMed/A; R.cabHa=R.rebMed/A; R.mortalidade=R.mortes/R.rebMed*100;
    R.desembCab=R.despesas/R.rebMed/J.meses; R.fixCab=R.fix/R.rebMed/J.meses; R.varCab=R.var/R.rebMed/J.meses;
    R.desembArr=R.despesas/R.prodArr; R.resArr=R.precoArr-R.desembArr; R.margem=R.resArr/R.precoArr*100; R.pctDesVenda=R.desembArr/R.precoArr*100;
    R.valIni=fVal(J.ei,cats); R.varReb=fVal(J.ef,cats)-R.valIni;
    R.varIns=fase?0:estoqueValor(mEnd(J.ef.mes))-estoqueValor(mEnd(J.ei.mes));
    R.caixa=R.receita-R.despesas-R.reposicao; R.resFinal=R.caixa+R.varReb+R.varIns;
    R.resHa=R.resFinal/A*R.anual; R.resValReb=R.resFinal/R.valIni*100*R.anual; R.prodPatr=(R.prodArr*R.precoArr)/R.valIni*100*R.anual;
    R.desembMatriz=R.despesas/R.matrizesMed/J.meses;
  }
  R.pctVar=R.var/R.despesas*100; R.pctInsPas=R.insPas/R.despesas*100;
  return R;
}
function quadrante(R){ if(!ok(R.pctDesVenda)||!ok(R.pctInsPas)) return 0; const x=R.pctDesVenda<70, y=R.pctInsPas>50; return x&&y?1:x?2:y?3:4; }

function chartMeses(J){

  const mx=Math.max(1,...v.map(x=>Math.max(x.r,x.c))); const step=Math.pow(10,Math.floor(Math.log10(mx))); const top=Math.ceil(mx/step)*step;

    s+=`<text x="${L+i*cw+cw/2}" y="${H-6}" text-anchor="middle" font-size="${n>8?9:11}" fill="var(--muted)">${MES[+x.m.slice(5)-1]}</text>`;});

/* barras empilhadas: vals[i] = valores de cada série no mês i (null = sem dado) */
function barrasR(ms,ser,vals,fmt,aria){

  const top=topDe(Math.max(0,...vals.map(v=>v?sum(v,x=>x):0))), y=v=>T+ch-(v/top)*ch;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">`;
  [0,.5,1].forEach(f=>{const yy=y(top*f);s+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${shortN(top*f)}</text>`;});
  ms.forEach((m,i)=>{ const v=vals[i], x0=L+i*cw+cw*.18, bw=cw*.64; let acc=0;

/* linhas: vals[i][k] = valor da série k no mês i (null = sem dado, a linha pula) */
function linhasR(ms,ser,vals,fmt,aria){

  ser.forEach((se,k)=>{ let d='', pen=false;
    vals.forEach((v,i)=>{ const val=v[k]; if(!ok(val)){pen=false;return;} d+=(pen?'L':'M')+xc(i).toFixed(1)+' '+y(val).toFixed(1); pen=true; });
    if(d) s+=`<path d="${d}" fill="none" stroke="${se.cor}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    vals.forEach((v,i)=>{ const val=v[k]; if(ok(val)) s+=`<circle cx="${xc(i).toFixed(1)}" cy="${y(val).toFixed(1)}" r="3" fill="${se.cor}"><title>${mLabel(ms[i])} · ${se.n}: ${fmt(val)}</title></circle>`; }); });
  ms.forEach((m,i)=>{ s+=`<text x="${xc(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="${n>8?9:11}" fill="var(--muted)">${MES[+m.slice(5)-1]}</text>`; });

/* entrada × saída: barra das vendas ao lado da barra empilhada de custos + compra de gado */
function entraSaiR(ms,v){

function chartRebanho(F){
  const W=340,H=150,L=40,B=22,T=10,ch=H-B-T,n=F.length,cw=(W-L-4)/n, mx=Math.max(1,...F.map(f=>fCab(f)));
  const step=Math.pow(10,Math.floor(Math.log10(mx))), top=Math.ceil(mx/step)*step, y=v=>T+ch-(v/top)*ch;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cabeças por mês">`;
  [0,.5,1].forEach(f=>{const yy=y(top*f);s+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${nf(top*f)}</text>`;});
  F.forEach((f,i)=>{const c=fCab(f),x0=L+i*cw+cw*.2;s+=`<rect x="${x0}" y="${y(c)}" width="${cw*.6}" height="${T+ch-y(c)}" rx="2" fill="var(--capim)" opacity="${i===n-1?1:.55}"><title>${mLabel(f.mes)}: ${nf(c)} cab.</title></rect><text x="${L+i*cw+cw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${MES[+f.mes.slice(5)-1]}</text>`;});
  return s+'</svg>';
}
function prefillFech(mes){
  const ex=S.fech.find(f=>f.mes===mes); if(ex) return ex.cats;
  const base=[...S.fech].filter(f=>f.mes<mes).sort((a,b)=>a.mes<b.mes?-1:1).pop();
  const cats={}; CK.forEach(c=>cats[c]={cab:cabOf(base,c),peso:pesoOf(base,c)});
  S.movs.filter(x=>ym(x.data)<=mes&&(!base||ym(x.data)>base.mes)).forEach(x=>{
    const n=+x.cab||0; const add=(c,v)=>{if(cats[c]) cats[c].cab+=v;};
    if(x.tipo==='nascimento'){ if(!cats[x.categoria].peso) cats[x.categoria].peso=+x.pesoMedio||30; add(x.categoria,n);}
    else if(x.tipo==='compra'){ const c=cats[x.categoria]; if(c){ const kg=c.cab*c.peso+n*(+x.pesoMedio||c.peso); c.cab+=n; c.peso=c.cab?kg/c.cab:0; } }
    else if(x.tipo==='venda'||x.tipo==='morte') add(x.categoria,-n);
    else if(x.tipo==='transferencia'){ const o=cats[x.categoria], d=cats[x.para]; if(o&&d){ const pw=+x.pesoMedio||o.peso; const kg=d.cab*d.peso+n*pw; o.cab-=n; d.cab+=n; d.peso=d.cab?kg/d.cab:0; } }
  });
  CK.forEach(c=>{cats[c].cab=Math.max(0,Math.round(cats[c].cab)); cats[c].peso=Math.round(cats[c].peso);});
  return cats;
}

  const pDesm=kgDesm/desm, taxaDesm=desm/exp*100;
  return {exp,pre,desm,prenhez:pre/exp*100,iatf:n('iatfPrenhes')/n('iatfExpostas')*100,servico:n('doses')/n('iatfPrenhes'),

function indLote(l){
  const n=k=>Number(l[k])||0, dias=l.dataSaida?days(l.dataEntrada,l.dataSaida):days(l.dataEntrada,today());
  const pe=n('pesoEntrada'), ps=n('pesoSaida'), carc=n('carcaca')||(ps?ps*.5:0), saiu=!!(l.dataSaida&&ps);
  const gmd=(ps-pe)/dias, ganhoCarc=(carc-pe*.5)/dias, diaria=n('nutricaoDia')+n('operacionalDia');
  const arrProd=(carc-pe*.5)/15, arrFinal=carc/15, custoLote=sum(S.desemb.filter(x=>x.loteId===l.id),x=>x.valor), oper=custoLote>0?custoLote/(n('cab')||1):diaria*dias, desBoi=n('aquisicao')+oper, venda=arrFinal*n('precoVenda');
  const desArrProd=oper/arrProd, desArrFinal=desBoi/arrFinal, aqArr=n('aquisicao')/(pe*.5/15);
  return {custoLote,dias,saiu,gmd,ganhoCarc,rendGanho:ganhoCarc/gmd*100,rendCarc:carc/ps*100,diaria,arrProd,arrFinal,oper,desBoi,venda,res:venda-desBoi,
    desArrProd,resArrProd:n('precoVenda')-desArrProd,margemProd:(n('precoVenda')-desArrProd)/n('precoVenda')*100,
    desArrFinal,resArrFinal:n('precoVenda')-desArrFinal,margemFinal:(n('precoVenda')-desArrFinal)/n('precoVenda')*100,
    roi:(venda-desBoi)/desBoi*100,agio:(aqArr-n('precoVenda'))/n('precoVenda')*100,aqArr,
    perm:n('idadeAbate')&&n('idadeDesmame')?n('idadeAbate')-n('idadeDesmame'):null};
}

/* ---------- Diluir ágio e Ponto de equilíbrio (modelo HuskyApp / Victor Darido) ---------- */
const lsGet=(k,d)=>{try{return {...d,...(JSON.parse(localStorage.getItem(k)||'null')||{})};}catch(e){return {...d};}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let AGIO=lsGet('calcAgio',{arroba:'',pago:'',peso:'',dias:'',gmd:''});
let PEQ=lsGet('calcPeq',{aquis:'',diaria:'',dias:'',pesoF:'',arroba:''});
function agioCalc(v){const n=k=>Number(v[k])||0, kg=kgA();
  const ref=n('peso')/kg*n('arroba'), agio=n('pago')-ref, pc=ref?agio/ref*100:0;
  const ganhoDia=n('gmd')/kg*n('arroba'), diasDil=ganhoDia>0?agio/ganhoDia:null;
  const arrProd=n('gmd')*n('dias')/kg;
  return {ref,agio,pc,ganhoDia,diasDil,porDia:n('dias')?agio/n('dias'):null,porArr:arrProd>0?agio/arrProd:null,arrProd,pagoArr:n('peso')?n('pago')/(n('peso')/kg):null};}
function agioOut(v){const r=agioCalc(v), n=k=>Number(v[k])||0;
  if(!(n('arroba')&&n('pago')&&n('peso'))) return '<p class="note">Preencha a arroba, o valor pago e o peso para calcular.</p>';
  const neg=r.agio<0;

function dbMake(){
  const fail=e=>{ const x=new Error(e?.message||'erro'); x.code=e?.code||'erro'; throw x; };
  const notify=async c=>{
    try{
      if(c==='config'){ const {data,error}=await sb.from('config').select('dados'); if(error) throw error; const row=data&&data[0];
        (subs.config||[]).forEach(f=>f.ok({exists:!!row,data:()=>row?row.dados||{}:{}})); return; }
      const {data,error}=await sb.from(c).select('id,dados').order('created_at',{ascending:true}); if(error) throw error;
      cache[c]=Object.fromEntries(data.map(r=>[r.id,r.dados||{}]));
      (subs[c]||[]).forEach(f=>f.ok({docs:data.map(r=>({id:r.id,data:()=>r.dados||{}}))}));
    }catch(e){ (subs[c]||[]).forEach(f=>f.err&&f.err(e)); }
  };
  const listen=(c,ok,err)=>{ (subs[c]=subs[c]||[]).push({ok,err}); notify(c); };
  return {
    refreshAll:()=>Promise.all(Object.keys(subs).map(notify)),
    collection:c=>({onSnapshot:(ok,err)=>{listen(c,ok,err);return()=>{};},
      add:async d=>{ const id=crypto.randomUUID(), dd=clean(d); const {error}=await sb.from(c).insert({id,owner:UID,...TAB[c](dd),dados:dd}); if(error) fail(error); await notify(c); return {id}; }}),
    doc:path=>{ const [c,id]=path.split('/');
      if(c==='config') return {
        onSnapshot:(ok,err)=>{listen('config',ok,err);return()=>{};},
        set:async d=>{ const {error}=await sb.from('config').upsert({owner:UID,dados:clean(d),updated_at:new Date().toISOString()},{onConflict:'owner'}); if(error) fail(error); await notify('config'); },
        update:async d=>{ const {data}=await sb.from('config').select('dados'); const old=(data&&data[0]&&data[0].dados)||{}; const {error}=await sb.from('config').upsert({owner:UID,dados:clean({...old,...d}),updated_at:new Date().toISOString()},{onConflict:'owner'}); if(error) fail(error); await notify('config'); },
        delete:async()=>{ const {error}=await sb.from('config').delete().eq('owner',UID); if(error) fail(error); await notify('config'); }};
      return {
        set:async d=>{ const dd=clean(d); const {error}=await sb.from(c).upsert({id,owner:UID,...TAB[c](dd),dados:dd},{onConflict:'owner,id'}); if(error) fail(error); await notify(c); },
        update:async d=>{ const old=(cache[c]||{})[id]||{}, m=clean({...old,...d}); const {error}=await sb.from(c).update({...TAB[c](m),dados:m}).eq('id',id); if(error) fail(error); await notify(c); },
        delete:async()=>{ const {error}=await sb.from(c).delete().eq('id',id); if(error) fail(error); await notify(c); }};
    }};
}
